; Sun Tuner — PvZ Hybrid Remake 阳光频率调节模组
; 配置文件，放在 user://sun_tuner.cfg（即游戏可写目录）
; Windows: %APPDATA%/Godot/app_userdata/<游戏名>/sun_tuner.cfg
; Android: /storage/emulated/0/Android/data/<包名>/files/sun_tuner.cfg

[general]
enabled = true

[sky_sun]
; 天空阳光掉落间隔（秒），原版约 10 秒
interval = 5.0
; 每次掉落数量，原版 25
amount = 25

[sunflower]
; 向日葵产光间隔（秒），原版约 24 秒
interval = 12.0
; 数量倍率
amount_multiplier = 1.0

[ui]
; 配置面板显示位置：top_left / top_right / bottom_left / bottom_right
panel_position = top_right
; 是否在屏幕角落显示调节按钮
show_hotkey_button = true
